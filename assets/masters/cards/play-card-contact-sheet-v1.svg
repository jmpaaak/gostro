    <path d="M31 30q58-20 130 2l-14 24 14 26Q94 64 31 83l13-27z" fill="#c52532" stroke="#65131d" stroke-width="6" stroke-linejoin="round"/>
    <path d="M52 43q43-10 86 0M50 70q44-12 89-1" fill="none" stroke="#ff8270" stroke-width="5" stroke-linecap="round"/>
