<svg xmlns="http://www.w3.org/2000/svg" width="960" height="288" viewBox="0 0 960 288">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8df"/><stop offset=".55" stop-color="#ead9ae"/><stop offset="1" stop-color="#c4a978"/>
    </linearGradient>
    <pattern id="fiber" width="18" height="18" patternUnits="userSpaceOnUse">
