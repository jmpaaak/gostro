  <!-- 청단: 같은 띠 문법, 쪽빛 색과 이중 매듭. -->
  <g transform="translate(384)">
    <use href="#card"/>
    <path d="M31 30q58-20 130 2l-14 24 14 26Q94 64 31 83l13-27z" fill="#24639a" stroke="#142f59" stroke-width="6" stroke-linejoin="round"/>
    <path d="M52 43q43-10 86 0M50 70q44-12 89-1" fill="none" stroke="#66b7d6" stroke-width="5" stroke-linecap="round"/>
