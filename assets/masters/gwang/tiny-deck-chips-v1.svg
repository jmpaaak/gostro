<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: an ultra-thin hwatu deck feeding five ten-chip towers. -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b1a"/><stop offset="0.5" stop-color="#123e37"/><stop offset="1" stop-color="#061310"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f0bd"/><stop offset="0.45" stop-color="#4fa879"/><stop offset="1" stop-color="#174f43"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a3"/><stop offset="0.45" stop-color="#d49a3e"/><stop offset="1" stop-color="#74431d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-35%" width="170%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".58"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="448" height="256" rx="40" fill="#030b0b"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#lacquer)" stroke="#9c7441" stroke-width="8"/>
  <path d="M27 52C120 17 329 18 421 53M27 208c92 31 302 31 394-1" fill="none" stroke="#347d68" stroke-width="5" opacity=".7"/>
  <path d="M47 39l15-14 15 14-15 14zm324 0l15-14 15 14-15 14z" fill="#e4bd62"/>

  <!-- Only three paper edges remain: an unmistakably smaller deck than the thin-deck relic. -->
