<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: sunrise through a jade opening gate with three starter scoring counters, signifying opening-round chips without text or month imagery. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102c45"/>
      <stop offset="0.55" stop-color="#275c69"/>
      <stop offset="1" stop-color="#e08b56"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7bd"/>
      <stop offset="0.55" stop-color="#ffc552"/>
      <stop offset="1" stop-color="#e45f38"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7ffe5"/>
      <stop offset="0.36" stop-color="#58c99c"/>
      <stop offset="0.72" stop-color="#187767"/>
      <stop offset="1" stop-color="#073a3e"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4a6"/>
      <stop offset="0.45" stop-color="#e9b948"/>
      <stop offset="1" stop-color="#875024"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="175%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="448" height="256" rx="40" fill="#07141f"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#sky)" stroke="#75b8b5" stroke-width="6"/>
  <path d="M22 188Q111 154 224 174Q337 154 426 188V240H22Z" fill="#123d45"/>

  <!-- One large rising sun stays legible at 56x32. -->
  <circle cx="224" cy="132" r="72" fill="url(#sun)" stroke="#fff2ae" stroke-width="7"/>
  <g stroke="#ffd881" stroke-width="8" stroke-linecap="round" opacity=".9">
    <path d="M224 34V18M156 53l-14-20m150 20 14-20M119 100 91 90m238 10 28-10"/>
  </g>

  <!-- An open jade gate identifies the opening-round condition. -->
  <g filter="url(#shadow)" stroke="#062d32" stroke-width="7" stroke-linejoin="round">
    <path d="M58 66h332l-30 35H88z" fill="url(#jade)"/>
    <path d="M91 102h42v116H91zm224 0h42v116h-42z" fill="url(#jade)"/>
    <path d="M76 94h296v27H76z" fill="#3ca181"/>
    <path d="M102 121h20v94h-20zm224 0h20v94h-20z" fill="#9be2bb" stroke="none" opacity=".55"/>
  </g>

  <!-- A deliberately small starter stack contrasts with the overflowing boss chest. -->
  <g filter="url(#shadow)" stroke="#553313" stroke-width="5">
    <ellipse cx="184" cy="210" rx="39" ry="15" fill="#8d5724"/>
    <rect x="145" y="180" width="78" height="31" fill="url(#coin)"/>
    <ellipse cx="184" cy="180" rx="39" ry="15" fill="url(#coin)"/>
    <ellipse cx="184" cy="180" rx="15" ry="6" fill="#fff5b0"/>
    <ellipse cx="264" cy="211" rx="34" ry="13" fill="#8d5724"/>
    <rect x="230" y="193" width="68" height="19" fill="url(#coin)"/>
    <ellipse cx="264" cy="193" rx="34" ry="13" fill="url(#coin)"/>
    <ellipse cx="264" cy="193" rx="13" ry="5" fill="#fff5b0"/>
  </g>

  <!-- Vermilion corner knots echo a traditional opening ceremony. -->
  <path d="M42 46l18-17 18 17-18 17zm328 0 18-17 18 17-18 17z" fill="#ef5a43" stroke="#ffd48a" stroke-width="4"/>
</svg>