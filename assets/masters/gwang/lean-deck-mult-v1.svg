<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: a lean hwatu deck channels three additive multiplier sparks into one seal. -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1728"/><stop offset="0.48" stop-color="#183d59"/><stop offset="1" stop-color="#07121d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5d9"/><stop offset="1" stop-color="#cda96f"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5f4c4"/><stop offset="0.48" stop-color="#57b28a"/><stop offset="1" stop-color="#176056"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a6"/><stop offset="0.45" stop-color="#d99a39"/><stop offset="1" stop-color="#754019"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="175%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".58"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="448" height="256" rx="40" fill="#030912"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#lacquer)" stroke="#a57b45" stroke-width="8"/>
  <path d="M28 52C119 18 330 18 420 52M28 208c92 31 301 31 392 0" fill="none" stroke="#397b82" stroke-width="5" opacity=".72"/>
  <path d="M45 40l15-14 15 14-15 14zm328 0l15-14 15 14-15 14z" fill="#e6c56e"/>

  <!-- Four visible paper edges establish a lean deck between the thin and tiny relics. -->
  <g filter="url(#shadow)">
    <path d="M55 159l159-23 61 27-159 25z" fill="#612c29" stroke="#100e12" stroke-width="8"/>
    <path d="M58 149l158-23 61 27-159 25z" fill="#f1d9aa" stroke="#28151b" stroke-width="5"/>
    <path d="M61 140l157-23 59 26-158 25z" fill="url(#paper)" stroke="#40212a" stroke-width="5"/>
    <path d="M65 130l154-22 56 25-156 24z" fill="#a82831" stroke="#50151e" stroke-width="5"/>
    <path d="M76 132l43 17 143-21M80 141l41 16 148-22" fill="none" stroke="#fff0c7" stroke-width="3"/>
    <path d="M113 119c18 0 35 7 45 19-13 7-30 9-48 5-8-8-7-16 3-24z" fill="#11372f" stroke="#e2bd60" stroke-width="4"/>
    <path d="M129 123l7 8 10-5-4 11 8 7-12-1-6 10-2-11-12-3 10-6z" fill="#79c89c"/>
  </g>

  <!-- Three separate sparks flow into one multiplier seal: additive +3, not the linked x3 motif. -->
  <g transform="translate(270 64)" filter="url(#shadow)">
    <path d="M-8 21C25 31 40 47 56 66M36 0c13 28 20 43 28 64M88 18C77 36 72 48 70 64" fill="none" stroke="#dda341" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(-9 17)"><path d="M0-18L8-7 20-5 11 4 14 17 1 11-10 18-8 5-19-3-7-7z" fill="url(#jade)" stroke="#f5d978" stroke-width="4"/></g>
    <g transform="translate(35 -2)"><path d="M0-18L8-7 20-5 11 4 14 17 1 11-10 18-8 5-19-3-7-7z" fill="url(#jade)" stroke="#f5d978" stroke-width="4"/></g>
    <g transform="translate(89 14)"><path d="M0-18L8-7 20-5 11 4 14 17 1 11-10 18-8 5-19-3-7-7z" fill="url(#jade)" stroke="#f5d978" stroke-width="4"/></g>
    <circle cx="64" cy="91" r="48" fill="#281b18" stroke="#f8dc7c" stroke-width="8"/>
    <circle cx="64" cy="91" r="35" fill="url(#jade)" stroke="#87552b" stroke-width="5"/>
    <path d="M64 62l10 18 21 4-15 15 3 22-19-10-19 10 3-22-15-15 21-4z" fill="url(#gold)" stroke="#70411e" stroke-width="4"/>
    <circle cx="64" cy="91" r="7" fill="#143d38"/>
  </g>
  <path d="M191 199c32 17 66 17 98 0" fill="none" stroke="#62ad94" stroke-width="5" stroke-linecap="round"/>
  <path d="M185 199l13-10v20zm110 0l-13-10v20z" fill="#e6c56e"/>
</svg>
