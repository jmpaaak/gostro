<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: a great vermilion court drum at full beat beneath a dancheong pavilion, signifying the main round multiplier without text or month imagery. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11152f"/>
      <stop offset="0.58" stop-color="#30305b"/>
      <stop offset="1" stop-color="#17152d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff936b"/>
      <stop offset="0.4" stop-color="#e94345"/>
      <stop offset="1" stop-color="#7d1632"/>
    </linearGradient>
    <radialGradient id="hide" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#fff1b2"/>
      <stop offset="0.62" stop-color="#e3b751"/>
      <stop offset="1" stop-color="#8e5324"/>
    </radialGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cf0ca"/>
      <stop offset="0.55" stop-color="#36a98b"/>
      <stop offset="1" stop-color="#12615b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="150%" height="165%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="448" height="256" rx="40" fill="#080a19"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#night)" stroke="#dda947" stroke-width="6"/>

  <!-- A broad dancheong roof marks the ceremonial main stage. -->
  <path d="M34 69Q102 24 224 31Q346 24 414 69L384 91H64Z" fill="#183f45" stroke="#071d29" stroke-width="7" stroke-linejoin="round"/>
  <path d="M52 66Q116 38 224 43Q332 38 396 66L374 77H74Z" fill="url(#jade)"/>
  <path d="M83 70l28-18 28 18 28-18 28 18 29-18 29 18 28-18 28 18 28-18 28 18" fill="none" stroke="#f0be4f" stroke-width="8" stroke-linejoin="round"/>
  <path d="M53 85h342" stroke="#e44d48" stroke-width="9"/>

  <!-- The oversized drum and four paired studs remain legible at 56x32. -->
  <g filter="url(#shadow)">
    <path d="M104 105Q224 78 344 105v104Q224 236 104 209Z" fill="url(#red)" stroke="#54152a" stroke-width="8"/>
    <ellipse cx="224" cy="157" rx="91" ry="72" fill="url(#hide)" stroke="#642a22" stroke-width="9"/>
    <ellipse cx="224" cy="157" rx="64" ry="49" fill="none" stroke="#fff0a0" stroke-width="6" opacity=".8"/>
    <g fill="#fff2a8" stroke="#71381e" stroke-width="4">
      <circle cx="132" cy="113" r="10"/><circle cx="316" cy="113" r="10"/>
      <circle cx="120" cy="158" r="10"/><circle cx="328" cy="158" r="10"/>
      <circle cx="132" cy="202" r="10"/><circle cx="316" cy="202" r="10"/>
    </g>
  </g>

  <!-- Two crossing mallets create an unmistakable doubled impact symbol. -->
  <g stroke="#482615" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M89 218L183 137"/><path d="M359 218L265 137"/>
    <path d="M68 205l36-30 26 31-36 30z" fill="url(#jade)"/>
    <path d="M380 205l-36-30-26 31 36 30z" fill="url(#jade)"/>
  </g>
  <path d="M224 119l12 24 26 4-19 19 5 27-24-13-24 13 5-27-19-19 26-4z" fill="#f65b4e" stroke="#fff2a8" stroke-width="5"/>
</svg>