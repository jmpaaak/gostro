<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: an imposing bronze commander's medallion depicting twin charging horses with crimson royal tassels on deep obsidian lacquer to signify a boss multiplier without text or month imagery. -->
  <defs>
    <linearGradient id="obsidian_lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f24"/>
      <stop offset="0.5" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#040507"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8cd82"/>
      <stop offset="0.4" stop-color="#a67b45"/>
      <stop offset="0.7" stop-color="#5e4120"/>
      <stop offset="1" stop-color="#2d1c0c"/>
    </linearGradient>
    <linearGradient id="bronze_rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1ba"/>
      <stop offset="0.5" stop-color="#b8893d"/>
      <stop offset="1" stop-color="#4a3013"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d62d3a"/>
      <stop offset="0.5" stop-color="#8f1021"/>
      <stop offset="1" stop-color="#420410"/>
    </linearGradient>
    <filter id="heavy_shadow" x="-30%" y="-35%" width="170%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".8"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect width="448" height="256" rx="40" fill="#030405"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#obsidian_lacquer)" stroke="#4a5363" stroke-width="6"/>
  
  <!-- Subtle Lacquer Pattern/Reflections -->
  <path d="M28 52C116 18 332 18 420 52M28 207c89 32 303 32 392 0" fill="none" stroke="#252b36" stroke-width="5"/>
  <path d="M42 39l16-13 16 13-16 14zm332 0l16-13 16 13-16 14z" fill="#3c4554"/>

  <!-- Tassels (Behind Medallion) -->
  <g filter="url(#heavy_shadow)">
    <!-- Main thick cord hanging down -->
    <path d="M224 40 L224 80 M180 80 Q224 140 268 80" fill="none" stroke="#d62d3a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Left Tassel -->
    <path d="M140 180 Q100 240 80 230" fill="none" stroke="url(#crimson)" stroke-width="18" stroke-linecap="round"/>
    <path d="M140 180 Q140 230 150 240" fill="none" stroke="url(#crimson)" stroke-width="24" stroke-linecap="round"/>
    <!-- Right Tassel -->
    <path d="M308 180 Q348 240 368 230" fill="none" stroke="url(#crimson)" stroke-width="18" stroke-linecap="round"/>
    <path d="M308 180 Q308 230 298 240" fill="none" stroke="url(#crimson)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Tassel Knots -->
    <circle cx="140" cy="170" r="16" fill="#8f1021" stroke="#e8cd82" stroke-width="4"/>
    <circle cx="308" cy="170" r="16" fill="#8f1021" stroke="#e8cd82" stroke-width="4"/>
  </g>

  <!-- Bronze Commander's Medallion -->
  <g filter="url(#heavy_shadow)">
    <!-- Medallion Loop -->
    <path d="M200 40 Q224 10 248 40" fill="none" stroke="url(#bronze_rim)" stroke-width="14" stroke-linecap="round"/>
    <rect x="210" y="38" width="28" height="20" fill="url(#bronze_rim)"/>

    <!-- Main Outer Rim -->
    <circle cx="224" cy="128" r="92" fill="#1b1207" stroke="url(#bronze_rim)" stroke-width="16"/>
    <!-- Inner Base -->
    <circle cx="224" cy="128" r="82" fill="url(#bronze)" stroke="#5e4120" stroke-width="6"/>
    
    <!-- Inner Decorative Ring -->
    <circle cx="224" cy="128" r="68" fill="none" stroke="#ffe594" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Twin Horses representing x2 -->
    <g fill="#ffe9a6" stroke="#5c3f15" stroke-width="2">
      <!-- Top Horse (Right-facing) -->
      <path d="M190 100 C200 75, 230 80, 245 90 L260 110 C240 120, 220 115, 200 120 Z"/>
      <circle cx="240" cy="92" r="3" fill="#1b1207" stroke="none"/>
      
      <!-- Bottom Horse (Left-facing) -->
      <path d="M258 156 C248 181, 218 176, 203 166 L188 146 C208 136, 228 141, 248 136 Z"/>
      <circle cx="208" cy="164" r="3" fill="#1b1207" stroke="none"/>
    </g>
    
    <!-- Center Dividing Line/Wave -->
    <path d="M156 128 Q224 100 292 128" fill="none" stroke="#fff1ba" stroke-width="4"/>
  </g>

  <!-- Left/Right X2 Glyphs (Subtle, iconic marks) -->
  <g filter="url(#heavy_shadow)" stroke="#fff1ba" stroke-linecap="round" fill="none">
    <g transform="translate(60, 108)">
      <path d="M0 0 L30 30 M0 30 L30 0" stroke-width="10"/>
      <path d="M15 15 L35 -5" stroke-width="6"/>
      <path d="M15 15 L35 35" stroke-width="6"/>
    </g>
    <g transform="translate(358, 108)">
      <path d="M0 0 L30 30 M0 30 L30 0" stroke-width="10"/>
      <path d="M-5 -5 L15 15" stroke-width="6"/>
      <path d="M-5 35 L15 15" stroke-width="6"/>
    </g>
  </g>
</svg>
