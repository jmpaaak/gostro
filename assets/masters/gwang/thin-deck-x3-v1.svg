<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: a tightly compressed hwatu deck beneath three multiplier seals. -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17131f"/><stop offset="0.48" stop-color="#382344"/><stop offset="1" stop-color="#120e1a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4dc"/><stop offset="1" stop-color="#d8b986"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a5"/><stop offset="0.45" stop-color="#d99435"/><stop offset="1" stop-color="#754019"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="448" height="256" rx="40" fill="#090711"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#lacquer)" stroke="#8d674b" stroke-width="8"/>
  <path d="M30 53C110 24 338 22 418 53M29 207c93 29 296 29 390-1" fill="none" stroke="#6f4568" stroke-width="5" opacity=".65"/>

  <!-- Side profile makes the unusually thin deck readable even at 56x32. -->
  <g filter="url(#shadow)">
    <path d="M82 146L276 119l75 34-193 30z" fill="#6b3727" stroke="#140d13" stroke-width="9"/>
    <path d="M83 132l194-27 75 33-194 30z" fill="url(#paper)" stroke="#24141a" stroke-width="7"/>
    <path d="M91 124l185-25 63 27-185 28z" fill="#9e262c" stroke="#4e1720" stroke-width="6"/>
    <path d="M105 126l49 20 172-24" fill="none" stroke="#e5c58e" stroke-width="4"/>
    <path d="M107 137l52 20 181-26M112 148l48 18 181-27" fill="none" stroke="#fff1c9" stroke-width="3" opacity=".9"/>
    <path d="M147 113c22 1 42 9 54 23-16 8-35 9-56 5-9-8-8-18 2-28z" fill="#171218" stroke="#d6ad5e" stroke-width="5"/>
    <circle cx="167" cy="129" r="7" fill="#f4d477"/>
    <path d="M264 106l45 19-38 6-43-18z" fill="#163e35" stroke="#d7b968" stroke-width="5"/>
    <path d="M254 112l16 12m3-15 16 12" stroke="#e84742" stroke-width="5"/>
  </g>

  <!-- Three linked seals carry the x3 idea without fragile lettering. -->
  <g transform="translate(120 61)" filter="url(#shadow)">
    <g transform="translate(0 8)"><circle r="28" fill="#331e18" stroke="#f6d77a" stroke-width="6"/><path d="M-13-2L0-15 13-2 7 15H-7z" fill="url(#gold)"/></g>
    <g transform="translate(104 -2)"><circle r="32" fill="#331e18" stroke="#fff0a5" stroke-width="7"/><path d="M-15-3L0-18 15-3 8 18H-8z" fill="url(#gold)"/></g>
    <g transform="translate(208 8)"><circle r="28" fill="#331e18" stroke="#f6d77a" stroke-width="6"/><path d="M-13-2L0-15 13-2 7 15H-7z" fill="url(#gold)"/></g>
    <path d="M29 7h42M137 7h42" stroke="#d99435" stroke-width="7"/>
  </g>
  <path d="M50 40l14-14 14 14-14 14zm335 175l10-10 10 10-10 10z" fill="#f6d77a"/>
</svg>