<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: an overstuffed silk purse releases coin stacks into a blue chip seal. -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2b"/><stop offset="0.48" stop-color="#155168"/><stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e85b58"/><stop offset="0.45" stop-color="#9f273f"/><stop offset="1" stop-color="#4d1731"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/><stop offset="0.5" stop-color="#dfa632"/><stop offset="1" stop-color="#713b18"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f5ef"/><stop offset="0.5" stop-color="#43a9bb"/><stop offset="1" stop-color="#16506d"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="175%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".62"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="448" height="256" rx="40" fill="#03090f"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#lacquer)" stroke="#d9ad51" stroke-width="8"/>
  <path d="M28 53C119 18 329 18 420 53M28 207c93 31 300 31 392 0" fill="none" stroke="#4e9aab" stroke-width="5" opacity=".75"/>
  <path d="M42 39l16-13 16 13-16 14zm332 0l16-13 16 13-16 14z" fill="#f5d66e"/>

  <!-- Heavy traditional drawstring purse, visibly packed with wealth. -->
  <g filter="url(#shadow)">
    <path d="M77 73c14 17 24 25 47 26 23-1 34-9 48-26l-16-25-32 13-31-13z" fill="url(#silk)" stroke="#2b1025" stroke-width="8"/>
    <path d="M80 81c-29 29-42 66-33 112 24 25 129 25 154 0 8-46-5-83-34-112-22 18-66 18-87 0z" fill="url(#silk)" stroke="#2b1025" stroke-width="8"/>
    <path d="M61 106c38 18 88 18 126 0M58 174c42 17 90 17 132 0" fill="none" stroke="#f39a69" stroke-width="6" opacity=".8"/>
    <path d="M84 75c25 12 55 12 80 0" fill="none" stroke="#f6d673" stroke-width="9" stroke-linecap="round"/>
    <path d="M87 75l-20 39m94-39 21 39" stroke="#f6d673" stroke-width="7" stroke-linecap="round"/>
    <g fill="url(#gold)" stroke="#75451d" stroke-width="4">
      <ellipse cx="82" cy="141" rx="24" ry="12"/><ellipse cx="123" cy="126" rx="24" ry="12"/>
      <ellipse cx="164" cy="141" rx="24" ry="12"/><ellipse cx="103" cy="159" rx="24" ry="12"/>
      <ellipse cx="145" cy="160" rx="24" ry="12"/>
    </g>
    <path d="M72 141h20m21-15h20m21 15h20m-81 18h20m22 1h20" stroke="#fff1a4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Eight tally chips stream into one large additive-chip seal. -->
  <g transform="translate(244 40)" filter="url(#shadow)">
    <path d="M2 77c34 11 53 26 70 48M27 48c27 27 42 47 52 72M58 31c17 34 24 57 28 87M92 30c4 39 3 61 0 87M125 43c-10 33-17 52-27 76M153 67c-21 22-34 36-49 57" fill="none" stroke="#e4b849" stroke-width="6" stroke-linecap="round"/>
    <g fill="url(#chip)" stroke="#e9fca6" stroke-width="4">
      <path d="M-10 54h24l8 12-8 12h-24l-8-12z"/><path d="M14 25h24l8 12-8 12H14L6 37z"/>
      <path d="M48 8h24l8 12-8 12H48l-8-12z"/><path d="M83 6h24l8 12-8 12H83l-8-12z"/>
      <path d="M119 20h24l8 12-8 12h-24l-8-12z"/><path d="M148 48h24l8 12-8 12h-24l-8-12z"/>
      <path d="M29 62h24l8 12-8 12H29l-8-12z"/><path d="M128 75h24l8 12-8 12h-24l-8-12z"/>
    </g>
    <circle cx="89" cy="148" r="59" fill="#081d2c" stroke="#ffe17b" stroke-width="8"/>
    <circle cx="89" cy="148" r="45" fill="url(#chip)" stroke="#1b5870" stroke-width="6"/>
    <path d="M62 126h54l13 22-13 22H62l-13-22z" fill="#e8fbca" stroke="#276d7b" stroke-width="6"/>
    <path d="M68 148h42M89 129v38" stroke="#25839b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="89" cy="148" r="8" fill="#fff0a1"/>
  </g>
</svg>
