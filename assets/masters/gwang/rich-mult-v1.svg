      <path d="M-16-9l9 10 13 2-9 9 2 13-12-6-12 7 2-14-10-8 13-3z"/>
      <path d="M25-25l9 10 13 2-9 9 2 13-12-6-12 7 2-14-10-8 13-3z"/>
      <path d="M72-24l9 10 13 2-9 9 2 13-12-6-12 7 2-14-10-8 13-3z"/>
      <path d="M112-5l9 10 13 2-9 9 2 13-12-6-12 7 2-14-10-8 13-3z"/>
    </g>
    <circle cx="58" cy="97" r="50" fill="#2b1729" stroke="#ffe18a" stroke-width="8"/>
    <circle cx="58" cy="97" r="36" fill="url(#gold)" stroke="#743e27" stroke-width="5"/>
    <path d="M58 67l10 19 22 4-16 16 4 22-20-10-20 10 4-22-16-16 22-4z" fill="url(#jade)" stroke="#315b3c" stroke-width="4"/>
    <circle cx="58" cy="97" r="7" fill="#fff0a1"/>
  </g>
  <path d="M194 201c31 15 63 15 94 0" fill="none" stroke="#d69b46" stroke-width="5" stroke-linecap="round"/>
