<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: an overflowing brass coin chest empowers a four-flame multiplier seal. -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24102f"/><stop offset="0.5" stop-color="#653555"/><stop offset="1" stop-color="#160b25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a1"/><stop offset="0.45" stop-color="#d89b32"/><stop offset="1" stop-color="#713919"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcefa4"/><stop offset="0.5" stop-color="#4fab78"/><stop offset="1" stop-color="#18533f"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="175%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="448" height="256" rx="40" fill="#09040f"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#lacquer)" stroke="#c59344" stroke-width="8"/>
  <path d="M28 52C119 18 330 18 420 52M28 208c92 31 301 31 392 0" fill="none" stroke="#ad687b" stroke-width="5" opacity=".7"/>
  <path d="M44 40l16-14 16 14-16 14zm328 0l16-14 16 14-16 14z" fill="#f1cf6d"/>

  <!-- A full Korean-style treasure chest makes the money threshold legible without currency text. -->
  <g filter="url(#shadow)">
    <path d="M48 115q76-66 151 0v27H48z" fill="#4d2027" stroke="#170d18" stroke-width="8"/>
    <path d="M60 110q64-47 127 0v18H60z" fill="#9b4a38" stroke="#e1ad4d" stroke-width="6"/>
    <path d="M45 130h159l-15 69H61z" fill="#7a302e" stroke="#170d18" stroke-width="8"/>
    <path d="M59 140h131l-12 48H70z" fill="#b45b3d" stroke="#e1ad4d" stroke-width="5"/>
    <path d="M113 135h29v39h-29z" fill="url(#gold)" stroke="#63351b" stroke-width="5"/>
    <circle cx="127" cy="153" r="7" fill="#33182a"/>
    <g fill="url(#gold)" stroke="#77451e" stroke-width="4">
      <ellipse cx="76" cy="110" rx="25" ry="13"/><ellipse cx="121" cy="91" rx="25" ry="13"/>
      <ellipse cx="169" cy="109" rx="25" ry="13"/><ellipse cx="96" cy="123" rx="25" ry="13"/>
      <ellipse cx="149" cy="124" rx="25" ry="13"/>
    </g>
    <path d="M66 110h20m25-19h20m28 18h20m-93 14h20m33 1h20" stroke="#fff0a1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Four wealth flames feed one additive multiplier seal. -->
  <g transform="translate(278 65)" filter="url(#shadow)">
    <path d="M-16 10C11 28 29 47 43 70M25-6c7 30 14 50 27 73M71-5c-1 30-1 49-10 72M110 14C89 34 76 48 69 70" fill="none" stroke="#e3a83c" stroke-width="7" stroke-linecap="round"/>
