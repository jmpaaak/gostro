<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256">
  <!-- Project-authored master: three interlocked Korean game tokens—a blue mother-of-pearl chip, crimson multiplier knot, and brass yeopjeon—form one compound engine for chips, multiplier, and money. -->
  <defs>
    <radialGradient id="night" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#263c57"/>
      <stop offset="0.65" stop-color="#101d31"/>
      <stop offset="1" stop-color="#060b15"/>
    </radialGradient>
    <radialGradient id="blue" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#d2ffff"/>
      <stop offset="0.42" stop-color="#51cce7"/>
      <stop offset="1" stop-color="#176594"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7969"/>
      <stop offset="0.52" stop-color="#c92d4c"/>
      <stop offset="1" stop-color="#681b3b"/>
    </linearGradient>
    <radialGradient id="gold" cx="32%" cy="25%" r="78%">
      <stop offset="0" stop-color="#fff2a1"/>
      <stop offset="0.45" stop-color="#e5ad39"/>
      <stop offset="1" stop-color="#8c501c"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="448" height="256" rx="40" fill="#050911"/>
  <rect x="8" y="8" width="432" height="240" rx="34" fill="url(#night)" stroke="#d4aa51" stroke-width="6"/>

  <!-- Braided circuit binds the three benefits into one repeating mechanism. -->
  <path d="M82 129C119 47 191 47 224 128s105 81 142 0" fill="none" stroke="#593d79" stroke-width="27" stroke-linecap="round" opacity=".75"/>
  <path d="M82 129c37 82 109 82 142 0s105-81 142 0" fill="none" stroke="#286e77" stroke-width="20" stroke-linecap="round" opacity=".8"/>
  <path d="M81 129h286" fill="none" stroke="#f4d678" stroke-width="8" stroke-dasharray="15 13" opacity=".9"/>

  <!-- Blue chip: the chips portion. -->
  <g transform="translate(84 128)">
    <circle r="67" fill="#0a273e" stroke="#07131f" stroke-width="9"/>
    <circle r="57" fill="url(#blue)" stroke="#84eff0" stroke-width="6"/>
    <circle r="35" fill="none" stroke="#176894" stroke-width="9" stroke-dasharray="15 9"/>
    <path d="M-23-7h46M-23 8h46" stroke="#fff5b5" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Crimson crossed silk knot: the multiplier portion, readable without lettering. -->
  <g transform="translate(224 128)" stroke="#54142c" stroke-width="8" stroke-linejoin="round">
    <path d="M-52-49L0-15l52-34 16 27L28 3l40 27-17 27L0 24l-51 33-17-27 41-27-41-25Z" fill="url(#red)"/>
    <path d="M-22-18L22 18M22-18L-22 18" stroke="#ffd46c" stroke-width="11" stroke-linecap="round"/>
    <circle r="17" fill="#ffca62" stroke="#7c2637" stroke-width="7"/>
  </g>

  <!-- Square-holed yeopjeon: the money portion. -->
  <g transform="translate(364 128)">
    <circle r="67" fill="#352214" stroke="#140e0b" stroke-width="9"/>
    <circle r="57" fill="url(#gold)" stroke="#ffe391" stroke-width="6"/>
    <circle r="42" fill="none" stroke="#a96520" stroke-width="8"/>
    <rect x="-18" y="-18" width="36" height="36" rx="2" fill="#151421" stroke="#fff0a0" stroke-width="7"/>
  </g>

  <!-- Three crown sparks reinforce the persistent three-part trigger. -->
  <g fill="#fff1a0" filter="url(#glow)">
    <path d="M82 37l7 14 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2Z"/>
    <path d="M224 25l7 14 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2Z"/>
    <path d="M364 37l7 14 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2Z"/>
  </g>
</svg>
