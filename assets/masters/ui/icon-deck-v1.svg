<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="card-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="0.5" stop-color="#cc0000"/>
      <stop offset="1" stop-color="#800000"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="70" y="70" width="220" height="280" rx="15" fill="#020b0a" opacity="0.6" filter="url(#shadow)" transform="rotate(-10 192 192)"/>
  
  <!-- Stack bottom cards -->
  <rect x="80" y="80" width="220" height="280" rx="15" fill="#e0e0e0" stroke="#000" stroke-width="4" transform="rotate(-6 192 192)"/>
  <rect x="85" y="75" width="220" height="280" rx="15" fill="#e0e0e0" stroke="#000" stroke-width="4" transform="rotate(-2 192 192)"/>
  
  <!-- Top Card -->
  <rect x="90" y="70" width="220" height="280" rx="15" fill="url(#card-back)" stroke="#ffffff" stroke-width="12" />
  
  <!-- Geometric texture on back -->
  <path d="M120 100 L260 240 M260 100 L120 240 M190 70 L190 350 M90 210 L310 210" stroke="#a00000" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
  <circle cx="190" cy="210" r="40" fill="none" stroke="#a00000" stroke-width="8" opacity="0.6" />
</svg>
