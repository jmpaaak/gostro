<svg xmlns="http://www.w3.org/2000/svg" width="384" height="480" viewBox="0 0 384 480">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="0.42" stop-color="#e0a32a"/>
      <stop offset="1" stop-color="#7a4310"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c85b"/>
      <stop offset="0.5" stop-color="#c47a1a"/>
      <stop offset="1" stop-color="#5c2c0d"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#d8b056"/>
      <stop offset="1" stop-color="#8a5418"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="196" cy="444" rx="118" ry="22" fill="#120805" opacity="0.55" filter="url(#shadow)"/>

  <!-- Shackle: thick U-shape that stays readable after 16x20 pixel conversion. -->
  <path d="M96 176c0-86 48-136 96-136s96 50 96 136v78"
        fill="none" stroke="#3a1c08" stroke-width="78" stroke-linecap="round"/>
  <path d="M96 176c0-86 48-136 96-136s96 50 96 136v78"
        fill="none" stroke="url(#shackle)" stroke-width="54" stroke-linecap="round"/>
  <path d="M96 176c0-86 48-136 96-136s96 50 96 136v78"
        fill="none" stroke="#fff6c8" stroke-width="12" stroke-linecap="round" opacity="0.7"/>

  <!-- Body: trapezoid padlock with keyhole, no people or month art. -->
  <rect x="58" y="196" width="268" height="228" rx="36" fill="#2a1408"/>
  <rect x="70" y="208" width="244" height="204" rx="28" fill="url(#body)" stroke="#fff0ba" stroke-width="10"/>
  <rect x="86" y="224" width="212" height="172" rx="18" fill="none" stroke="#7a3e10" stroke-width="8" opacity="0.55"/>

  <circle cx="192" cy="292" r="34" fill="#2a1408"/>
  <circle cx="192" cy="292" r="22" fill="#ffe58a"/>
  <path d="M192 308v52" stroke="#2a1408" stroke-width="22" stroke-linecap="round"/>
  <path d="M192 308v46" stroke="#fff3c4" stroke-width="8" stroke-linecap="round"/>
</svg>
