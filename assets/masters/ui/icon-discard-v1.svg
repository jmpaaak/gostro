<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b52"/>
      <stop offset="0.48" stop-color="#c91f2c"/>
      <stop offset="1" stop-color="#68111d"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="0.5" stop-color="#cf8b2f"/>
      <stop offset="1" stop-color="#704018"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
