<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8ad"/><stop offset="0.55" stop-color="#a78166"/><stop offset="1" stop-color="#48364e"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#516577"/><stop offset="0.5" stop-color="#25313f"/><stop offset="1" stop-color="#111721"/>
    </linearGradient>
    <radialGradient id="mask" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#f1c963"/><stop offset="0.5" stop-color="#be4c3f"/><stop offset="1" stop-color="#61293c"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect x="28" y="27" width="344" height="508" rx="34" fill="#11121b" opacity=".55" filter="url(#shadow)"/>
  <rect x="20" y="18" width="360" height="510" rx="32" fill="#292033" stroke="#100d17" stroke-width="12"/>
  <rect x="34" y="32" width="332" height="482" rx="23" fill="url(#paper)" stroke="#65404b" stroke-width="9"/>

  <!-- Korean cloud bands frame the once-per-ante boss replacement. -->
  <path d="M49 91Q67 58 96 80Q119 48 146 80Q169 57 191 82Q169 105 141 91Q114 117 85 94Q65 107 49 91Z" fill="#70404b" stroke="#2d2230" stroke-width="7"/>
  <path d="M351 451Q333 484 304 462Q281 494 254 462Q231 485 209 460Q231 437 259 451Q286 425 315 448Q335 435 351 451Z" fill="#70404b" stroke="#2d2230" stroke-width="7"/>
  <path d="M53 120H347M53 430H347" stroke="#352638" stroke-width="11"/>
  <path d="M58 120l18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13" fill="none" stroke="#d8aa55" stroke-width="6"/>

  <!-- A hinged slate makes the cut/replacement action legible at shop scale. -->
  <g transform="rotate(-6 200 265)">
    <rect x="103" y="178" width="194" height="190" rx="16" fill="url(#slate)" stroke="#171522" stroke-width="11"/>
    <path d="M98 175l22-49 190 22-15 47z" fill="#e0bd68" stroke="#171522" stroke-width="10" stroke-linejoin="round"/>
    <path d="M126 132l22 55m41-45 22 55m41-45 22 55" stroke="#4f3340" stroke-width="15"/>
    <circle cx="198" cy="276" r="68" fill="url(#mask)" stroke="#e7c36b" stroke-width="9"/>
    <!-- Horned boss mask; no character, month, or card numeral. -->
    <path d="M151 245l-23-35 40 17m77 8 29-30-8 43" fill="#be4c3f" stroke="#351d2d" stroke-width="9" stroke-linejoin="round"/>
    <path d="M157 248Q198 218 239 248L229 308Q198 337 167 308Z" fill="#d9b15c" stroke="#351d2d" stroke-width="9"/>
    <path d="M166 266l23-9-8 22zm64 0-23-9 8 22z" fill="#302033" stroke="#302033" stroke-width="5" stroke-linejoin="round"/>
    <path d="M184 303q14 13 28 0" fill="none" stroke="#7d3340" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Opposed arrows describe rerolling the current boss blind exactly once. -->
  <g fill="none" stroke="#f5db7b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M87 309Q59 258 88 214"/>
    <path d="M69 220l22-15 4 29"/>
    <path d="M313 232q28 51-1 95"/>
    <path d="M331 321l-22 15-4-29"/>
  </g>

  <!-- Single seal bead encodes one reroll rather than an unlimited refresh. -->
  <circle cx="200" cy="398" r="25" fill="#b7353e" stroke="#5a2433" stroke-width="8"/>
  <path d="M200 384v29m-11-20h22" stroke="#efd99a" stroke-width="7" stroke-linecap="round"/>
  <rect x="284" y="365" width="59" height="59" rx="7" fill="#a92f3b" stroke="#5d2030" stroke-width="8"/>
  <path d="M297 378h33v33h-33zm11 0v33m12-33v33m-23-16h33" fill="none" stroke="#ead69c" stroke-width="6"/>
  <path d="M151 18h98l-13 28h-72z" fill="#d0a250" stroke="#50303a" stroke-width="7"/>
  <circle cx="200" cy="31" r="8" fill="#9e3540"/>
</svg>