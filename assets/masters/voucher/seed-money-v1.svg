<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1bd"/><stop offset="0.58" stop-color="#eac878"/><stop offset="1" stop-color="#bc7945"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a94a35"/><stop offset="0.5" stop-color="#762d32"/><stop offset="1" stop-color="#451d2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe16d"/><stop offset="0.48" stop-color="#d99b2d"/><stop offset="1" stop-color="#8a4b22"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f9c63"/><stop offset="1" stop-color="#1f5948"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect x="28" y="27" width="344" height="508" rx="34" fill="#201528" opacity=".42" filter="url(#shadow)"/>
  <rect x="20" y="18" width="360" height="510" rx="32" fill="#30203b" stroke="#130d19" stroke-width="12"/>
  <rect x="34" y="32" width="332" height="482" rx="23" fill="url(#paper)" stroke="#a73535" stroke-width="9"/>
  <path d="M49 65H351M49 481H351" stroke="#174f5f" stroke-width="17"/>
  <path d="M49 65l24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17M49 481l24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17" fill="none" stroke="#efb941" stroke-width="9" stroke-linejoin="round"/>
  <path d="M151 18h98l-13 28h-72z" fill="#efb941" stroke="#6b3825" stroke-width="7"/>
  <circle cx="200" cy="31" r="8" fill="#932f31"/>

  <!-- A principal purse: the tied body protects the starting capital. -->
  <ellipse cx="199" cy="409" rx="112" ry="25" fill="#4c2525" opacity=".35"/>
  <path d="M126 270Q99 315 103 386Q106 441 200 449Q294 441 297 386Q301 315 274 270Q237 288 200 286Q163 288 126 270Z" fill="url(#pouch)" stroke="#421c29" stroke-width="9"/>
  <path d="M123 307Q200 337 277 307M119 354Q200 385 281 354" fill="none" stroke="#c96a45" stroke-width="7" opacity=".75"/>
  <path d="M139 280Q200 305 261 280" fill="none" stroke="#f0b64e" stroke-width="14"/>
  <path d="M167 286Q133 258 112 284Q145 291 167 307M233 286Q267 258 288 284Q255 291 233 307" fill="#be4937" stroke="#63252d" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="200" cy="289" r="17" fill="#d89a32" stroke="#78401f" stroke-width="7"/>

  <!-- Yeopjeon coins climb upward to show interest growth. -->
  <g stroke="#75411f" stroke-width="7">
    <ellipse cx="151" cy="245" rx="43" ry="18" fill="#9c5a25"/>
    <path d="M108 226v19c0 10 19 18 43 18s43-8 43-18v-19" fill="#b56f28"/>
    <ellipse cx="151" cy="226" rx="43" ry="18" fill="url(#gold)"/>
    <rect x="140" y="218" width="22" height="16" rx="2" fill="#694026" stroke-width="4"/>
    <path d="M116 207v18c0 10 18 18 41 18s41-8 41-18v-18" fill="#bd792d"/>
    <ellipse cx="157" cy="207" rx="41" ry="18" fill="url(#gold)"/>
    <rect x="147" y="199" width="21" height="16" rx="2" fill="#694026" stroke-width="4"/>
    <path d="M128 188v18c0 9 17 16 38 16s38-7 38-16v-18" fill="#c98731"/>
    <ellipse cx="166" cy="188" rx="38" ry="17" fill="url(#gold)"/>
    <rect x="156" y="181" width="20" height="15" rx="2" fill="#694026" stroke-width="4"/>
  </g>

  <!-- A living sprout differentiates seed money from a generic coin voucher. -->
  <path d="M176 184Q193 151 201 113M200 146Q224 118 251 118M195 137Q167 113 142 118" fill="none" stroke="#24533f" stroke-width="10" stroke-linecap="round"/>
  <path d="M201 119Q222 83 262 88Q249 125 207 132Z" fill="url(#leaf)" stroke="#194232" stroke-width="7"/>
  <path d="M190 132Q168 94 127 101Q141 139 184 145Z" fill="#4d8758" stroke="#194232" stroke-width="7"/>
  <path d="M201 117Q191 87 207 67Q229 91 207 122Z" fill="#73a962" stroke="#194232" stroke-width="7"/>
  <path d="M211 119q22-17 41-23M180 134q-21-17-42-22" fill="none" stroke="#b4c86b" stroke-width="4"/>

  <!-- Vermilion registry seal and small corner coins. -->
  <rect x="278" y="91" width="62" height="62" rx="6" fill="#c9362d" stroke="#751d21" stroke-width="8"/>
  <path d="M291 105h36v34h-36zm12 0v34m13-34v34m-25-17h36" fill="none" stroke="#f6d78d" stroke-width="6"/>
  <g fill="url(#gold)" stroke="#75411f" stroke-width="6">
    <circle cx="297" cy="414" r="24"/><circle cx="91" cy="394" r="20"/>
  </g>
  <rect x="287" y="404" width="20" height="20" rx="3" fill="#704126"/>
  <rect x="83" y="386" width="16" height="16" rx="2" fill="#704126"/>
