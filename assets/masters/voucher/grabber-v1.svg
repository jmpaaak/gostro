<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0bf"/>
      <stop offset="1" stop-color="#d8aa61"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b94f"/>
      <stop offset=".5" stop-color="#a95a2a"/>
      <stop offset="1" stop-color="#5b2b25"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75aa5c"/>
      <stop offset="1" stop-color="#275946"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <!-- A hand rake gathering a broad harvest communicates one extra hand. -->
  <rect x="27" y="25" width="346" height="510" rx="34" fill="#321f38" opacity=".36" filter="url(#shadow)"/>
  <rect x="20" y="18" width="360" height="510" rx="32" fill="#35213f" stroke="#140d1b" stroke-width="12"/>
  <rect x="34" y="32" width="332" height="482" rx="23" fill="url(#paper)" stroke="#bd3f37" stroke-width="9"/>
  <!-- Shared dancheong frame keeps the permanent-seal family recognizable. -->
  <path d="M49 64H351M49 482H351" stroke="#174f5f" stroke-width="17"/>
  <path d="M49 64l24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17M49 482l24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17 24-17 24 17" fill="none" stroke="#e8b43e" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="62" cy="104" r="10" fill="#bd3f37"/><circle cx="338" cy="104" r="10" fill="#bd3f37"/>
  <circle cx="62" cy="441" r="10" fill="#174f5f"/><circle cx="338" cy="441" r="10" fill="#174f5f"/>
  <!-- Terraced furrows make the tool read as a farm rake, not a fork. -->
  <path d="M55 340Q200 268 345 340V448H55Z" fill="url(#field)" stroke="#173e38" stroke-width="10"/>
  <path d="M62 375q138-67 276 0M59 414q141-61 282 0M61 451q139-53 278 0" fill="none" stroke="#d6ae4a" stroke-width="12"/>
  <path d="M83 359q18-45 36-3m-7 22q17-54 36-7m103-8q19-50 37-4m-10 27q20-57 39-8" fill="none" stroke="#f1cf68" stroke-width="8" stroke-linecap="round"/>
  <!-- Oversized diagonal wooden handle remains legible at 36x52. -->
  <path d="M113 357L282 137" stroke="#4b2925" stroke-width="34" stroke-linecap="round"/>
  <path d="M113 350L279 134" stroke="url(#wood)" stroke-width="22" stroke-linecap="round"/>
  <path d="M145 306L248 172" stroke="#f4cb62" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  <!-- Wide five-tine rake head forms a unique silhouette. -->
  <path d="M68 302Q119 348 170 373" fill="none" stroke="#4b2925" stroke-width="38" stroke-linecap="round"/>
  <path d="M68 296Q119 337 172 362" fill="none" stroke="url(#wood)" stroke-width="25" stroke-linecap="round"/>
  <g fill="none" stroke="#683426" stroke-width="16" stroke-linecap="round">
    <path d="M76 305l-25 43"/><path d="M98 321l-21 48"/><path d="M121 337l-16 49"/><path d="M145 350l-11 48"/><path d="M168 360l-6 45"/>
  </g>
  <g fill="none" stroke="#d78b37" stroke-width="8" stroke-linecap="round">
    <path d="M76 304l-25 43"/><path d="M98 320l-21 48"/><path d="M121 336l-16 49"/><path d="M145 349l-11 48"/><path d="M168 359l-6 45"/>
  </g>
  <!-- Vermilion seal and brass notch identify an in-game seal. -->
  <rect x="276" y="112" width="64" height="64" rx="6" fill="#c9362d" stroke="#751d21" stroke-width="8"/>
  <path d="M290 128h36v32h-36zm9 0v32m17-32v32m-26-16h36" fill="none" stroke="#f6d78d" stroke-width="6"/>
  <path d="M151 18h98l-13 28h-72z" fill="#e8b43e" stroke="#6c3a24" stroke-width="7"/>
  <circle cx="200" cy="31" r="8" fill="#8e2f2c"/>
</svg>