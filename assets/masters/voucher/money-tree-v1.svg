<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8ad"/><stop offset="0.55" stop-color="#a78166"/><stop offset="1" stop-color="#48364e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#8a6c1c"/>
    </linearGradient>
  </defs>

  <rect x="28" y="27" width="344" height="508" rx="34" fill="#11121b" opacity=".55" filter="url(#shadow)"/>
  <rect x="20" y="18" width="360" height="510" rx="32" fill="#292033" stroke="#100d17" stroke-width="12"/>
  <rect x="34" y="32" width="332" height="482" rx="23" fill="url(#paper)" stroke="#65404b" stroke-width="9"/>

  <!-- Korean cloud bands -->
  <path d="M49 91Q67 58 96 80Q119 48 146 80Q169 57 191 82Q169 105 141 91Q114 117 85 94Q65 107 49 91Z" fill="#70404b" stroke="#2d2230" stroke-width="7"/>
  <path d="M351 451Q333 484 304 462Q281 494 254 462Q231 485 209 460Q231 437 259 451Q286 425 315 448Q335 435 351 451Z" fill="#70404b" stroke="#2d2230" stroke-width="7"/>
  <path d="M53 120H347M53 430H347" stroke="#352638" stroke-width="11"/>
  <path d="M58 120l18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13" fill="none" stroke="#d8aa55" stroke-width="6"/>

  <!-- Tree trunk and branches (Gold Vein Tree) -->
  <g stroke="#3d2c20" stroke-linecap="round" fill="none">
    <path d="M200 360 Q180 270 200 170" stroke-width="26"/>
    <path d="M200 280 Q140 230 110 180" stroke-width="18"/>
    <path d="M195 240 Q250 190 280 150" stroke-width="16"/>
    <path d="M150 200 Q140 160 130 130" stroke-width="12"/>
    <path d="M240 170 Q250 130 260 110" stroke-width="10"/>
  </g>

  <!-- Golden coins (leaves) -->
  <g stroke="#6e5015" stroke-width="5" fill="url(#gold)">
    <circle cx="200" cy="165" r="24"/>
    <circle cx="105" cy="175" r="20"/>
    <circle cx="285" cy="145" r="22"/>
    <circle cx="125" cy="125" r="18"/>
    <circle cx="265" cy="105" r="16"/>
    <circle cx="160" cy="220" r="18"/>
    <circle cx="230" cy="200" r="16"/>
    <circle cx="220" cy="260" r="18"/>
    <circle cx="170" cy="280" r="16"/>
  </g>

  <!-- Square holes in coins for traditional look -->
  <g fill="#292033">
    <rect x="190" y="155" width="20" height="20" rx="3"/>
    <rect x="96" y="166" width="18" height="18" rx="2"/>
    <rect x="275" y="135" width="20" height="20" rx="3"/>
    <rect x="117" y="117" width="16" height="16" rx="2"/>
    <rect x="259" y="99" width="12" height="12" rx="2"/>
    <rect x="152" y="212" width="16" height="16" rx="2"/>
    <rect x="223" y="193" width="14" height="14" rx="2"/>
    <rect x="212" y="252" width="16" height="16" rx="2"/>
    <rect x="163" y="273" width="14" height="14" rx="2"/>
  </g>

  <!-- Ground / Gold Vein at base -->
  <path d="M120 370 Q200 330 280 370 L260 390 Q200 410 140 390 Z" fill="url(#gold)" stroke="#5a3d2b" stroke-width="8"/>
  <path d="M150 360 L180 375 M220 375 L250 365" stroke="#ffe57f" stroke-width="4" stroke-linecap="round"/>

  <!-- Seal bead (bottom red stamp) -->
  <circle cx="200" cy="398" r="25" fill="#b7353e" stroke="#5a2433" stroke-width="8"/>
  <path d="M200 384v29m-11-20h22" stroke="#efd99a" stroke-width="7" stroke-linecap="round"/>
  
  <rect x="284" y="365" width="59" height="59" rx="7" fill="#a92f3b" stroke="#5d2030" stroke-width="8"/>
  <path d="M297 378h33v33h-33zm11 0v33m12-33v33m-23-16h33" fill="none" stroke="#ead69c" stroke-width="6"/>

  <path d="M151 18h98l-13 28h-72z" fill="#d0a250" stroke="#50303a" stroke-width="7"/>
  <circle cx="200" cy="31" r="8" fill="#9e3540"/>
</svg>
