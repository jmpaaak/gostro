  <g fill="#f0d27b">
    <path d="M195 137h10l5 54-10 13-10-13z"/>
    <path d="M195 409h10l5-54-10-13-10 13z"/>
    <path d="M83 268v10l54 5 13-10-13-10z"/>
    <path d="M317 268v10l-54 5-13-10 13-10z"/>
  </g>

  <!-- The empty ring is the additional gwang slot: visible frame, truly dark center. -->
  <circle cx="200" cy="273" r="105" fill="#241b32" opacity=".35"/>
  <circle cx="200" cy="273" r="91" fill="url(#pearl)" stroke="#171023" stroke-width="10"/>
  <circle cx="200" cy="273" r="68" fill="url(#void)" stroke="#d4b9dd" stroke-width="7"/>
  <circle cx="200" cy="273" r="42" fill="#030309"/>
  <path d="M167 233Q184 216 202 220M229 252Q239 270 230 286M174 309Q190 322 209 315" fill="none" stroke="#d5f0df" stroke-width="7" stroke-linecap="round" opacity=".85"/>
