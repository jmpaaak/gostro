<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5d9bb"/><stop offset="0.5" stop-color="#b9a784"/><stop offset="1" stop-color="#71627a"/>
    </linearGradient>
    <radialGradient id="void" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#05050b"/><stop offset="0.53" stop-color="#111025"/><stop offset="0.78" stop-color="#3b2854"/><stop offset="1" stop-color="#b98bd1"/>
    </radialGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
