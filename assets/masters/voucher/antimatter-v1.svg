  <rect x="28" y="27" width="344" height="508" rx="34" fill="#130f20" opacity=".45" filter="url(#shadow)"/>
  <rect x="20" y="18" width="360" height="510" rx="32" fill="#231a32" stroke="#090711" stroke-width="12"/>
  <rect x="34" y="32" width="332" height="482" rx="23" fill="url(#paper)" stroke="#4c3765" stroke-width="9"/>

