  <path d="M49 114H351M49 432H351" stroke="#332745" stroke-width="11"/>
  <path d="M55 114l18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13 18-13 18 13" fill="none" stroke="#d0a456" stroke-width="6"/>

  <!-- Four split gwang rays bend away, showing room created by the void. -->
  <g fill="#d7ad4c" stroke="#65472d" stroke-width="7" stroke-linejoin="round">
    <path d="M189 126h22l11 72-22 25-22-25z"/>
    <path d="M189 420h22l11-72-22-25-22 25z"/>
